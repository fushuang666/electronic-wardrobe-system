server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wardrobe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

wardrobe:
  upload:
    # 上传文件保存目录（请使用绝对路径或确保相对路径可写）
    path: ./uploads
    url-prefix: /api/files
  jwt:
    secret: wardrobe-secret-key-2026-please-change-it
    expiration: 86400000
  weather:
    # OpenWeatherMap 免费 API key；留空则自动降级为本地模拟数据
    api-key: ""
    provider: openweathermap
